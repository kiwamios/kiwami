<!-- The wallpaper a machine has before it has any of yours.

     Deliberately not a photograph. A default that ships with a distro is
     downloaded by everyone who ever clones it, forever, and lives in the Nix
     store of every machine built from it - so it is a few hundred bytes of
     gradient rather than four megabytes of somebody's holiday.

     Kiwami's accent colours, at rest. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1a1b26"/>
      <stop offset="0.55" stop-color="#24283b"/>
      <stop offset="1"   stop-color="#2f3549"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- 極 - "extreme", the character the project is named for. -->
  <text x="800" y="560" text-anchor="middle"
        font-family="serif" font-size="230"
        fill="#c0caf5" fill-opacity="0.07">極</text>
</svg>
